name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Ruff Linting
        run: python -m ruff check .
      - name: Run Pytest and Coverage
        run: python -m pytest -v

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Check for Go files
        id: check_go
        run: |
          if find . -name '*.go' -not -path './.git/*' | grep -q .; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "No Go files found, skipping Go tests."
          fi
      - name: Run golangci-lint
        if: steps.check_go.outputs.has_go == 'true'
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
      - name: Run Go Tests with Coverage
        if: steps.check_go.outputs.has_go == 'true'
        run: |
          go test -v -coverprofile=coverage.out ./...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "Coverage is below 80%!"
            exit 1
          fi
