[project]
name = "agents-framework"
version = "0.1.0"
description = "Agent Workflow Framework with MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "litellm>=1.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=mcp_server --cov-report=term-missing --cov-fail-under=80"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
